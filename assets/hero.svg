<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ayush Sharma – Linux, Networks and DevOps</title>
  <desc id="d">Light-themed banner with an isometric server stack connected to network nodes.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#CBD5E1" opacity=".6"/></pattern>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  </defs>
  <rect width="1200" height="380" fill="#FFFFFF"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect x="0" y="372" width="1200" height="8" fill="url(#bar)"/>

  <!-- network links -->
  <g stroke="#06B6D4" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity=".75">
    <line x1="780" y1="90" x2="950" y2="175"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/></line>
    <line x1="1110" y1="80" x2="950" y2="175"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/></line>
    <line x1="1120" y1="300" x2="950" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/></line>
    <line x1="790" y1="320" x2="950" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.5">
    <circle cx="780" cy="90" r="11"><animate attributeName="r" values="11;13;11" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="80" r="11"><animate attributeName="r" values="11;13;11" dur="3s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="300" r="11"><animate attributeName="r" values="11;13;11" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="320" r="11"><animate attributeName="r" values="11;13;11" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- isometric server stack (bottom to top) -->
  <g stroke="#0B1F3A" stroke-width="1.5" stroke-linejoin="round">
    <g>
      <polygon points="950,225 1040,270 950,315 860,270" fill="#E0F2FE"/>
      <polygon points="860,270 950,315 950,337 860,292" fill="#7DD3FC"/>
      <polygon points="950,315 1040,270 1040,292 950,337" fill="#38BDF8"/>
    </g>
    <g>
      <polygon points="950,155 1040,200 950,245 860,200" fill="#F0F9FF"/>
      <polygon points="860,200 950,245 950,267 860,222" fill="#BAE6FD"/>
      <polygon points="950,245 1040,200 1040,222 950,267" fill="#7DD3FC"/>
    </g>
    <g>
      <polygon points="950,85 1040,130 950,175 860,130" fill="#FFFFFF"/>
      <polygon points="860,130 950,175 950,197 860,152" fill="#E0F2FE"/>
      <polygon points="950,175 1040,130 1040,152 950,197" fill="#BAE6FD"/>
    </g>
  </g>
  <!-- status LEDs -->
  <g fill="#06B6D4" stroke="none">
    <circle cx="876" cy="151" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="158" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="876" cy="221" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="228" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="876" cy="291" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="298" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin=".6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="95" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0891B2" letter-spacing="1">~/oct-ayusharma</text>
    <text x="80" y="170" font-size="64" font-weight="700" fill="#0B1F3A">Ayush Sharma</text>
    <text x="80" y="218" font-size="24" fill="#334155">Building my foundation in Linux, Networks &amp; DevOps.</text>
    <text x="80" y="256" font-size="16" fill="#64748B">Aspiring System Administrator · Network Engineer</text>
    <text x="80" y="280" font-size="16" fill="#64748B">Linux Enthusiast · DevOps Learner</text>
    <text x="80" y="332" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0B1F3A">$ learn --linux --networks --devops<tspan fill="#06B6D4"> ▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
